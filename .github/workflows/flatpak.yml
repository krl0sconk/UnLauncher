name: Flatpak

# Builds the Flatpak of a release, signs it, attaches the .flatpak bundle to the
# GitHub release and publishes the signed OSTree repository on GitHub Pages.
# See packaging/flatpak/README.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v0.1.0
        required: true

permissions: {}

# One publish at a time; never cancel one that is running.
concurrency:
  group: flatpak
  cancel-in-progress: false

env:
  APP_ID: io.github.krl0sconk.UnLauncher
  BRANCH: stable
  TAG: ${{ inputs.tag || github.ref_name }}
  SITE_URL: https://krl0sconk.github.io/UnLauncher
  FLATHUB_REPO: https://dl.flathub.org/repo/flathub.flatpakrepo

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # GNOME 51 image of the official Flatpak actions (flatpak-builder included).
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Tags made before this packaging existed (v0.1.0) lack packaging/flatpak/;
      # the source is the tag's, the packaging comes from the workflow's ref.
      - uses: actions/checkout@v7
        with:
          path: workflow-ref
          sparse-checkout: packaging/flatpak
      - name: Packaging files missing from the tag
        run: |
          if [ ! -f packaging/flatpak/unlauncher-repo.gpg ]; then
            echo "Using packaging/flatpak from $GITHUB_SHA"
            rm -rf packaging/flatpak packaging/flathub
            cp -r workflow-ref/packaging/flatpak packaging/flatpak
          fi
          rm -rf workflow-ref

      - name: Version
        id: version
        run: |
          VERSION="${TAG#v}"
          grep -q "<release version=\"$VERSION\"" packaging/linux/$APP_ID.metainfo.xml \
            || { echo "::error::$TAG has no <release> in the metainfo"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          # The key users trust (published in the repo) must be the one that signs.
          gpg --show-keys --with-colons packaging/flatpak/unlauncher-repo.gpg \
            | awk -F: '/^fpr/ {print $10; exit}' | grep -qx "$GPG_KEY_ID" \
            || { echo "::error::FLATPAK_GPG_KEY_ID does not match packaging/flatpak/unlauncher-repo.gpg"; exit 1; }

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/${{ env.APP_ID }}.yml
          branch: ${{ env.BRANCH }}
          repo-dir: repo
          gpg-sign: ${{ secrets.FLATPAK_GPG_KEY_ID }}
          repository-url: ${{ env.FLATHUB_REPO }}
          build-bundle: 'false'
          upload-artifact: 'false'
          cache-key: flatpak-builder-${{ hashFiles('Cargo.lock', 'packaging/flatpak/*.yml') }}

      - name: Sign and optimise the repository
        env:
          GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
        run: |
          flatpak build-update-repo --generate-static-deltas --prune \
            --gpg-sign="$GPG_KEY_ID" --title="UnLauncher" repo
          flatpak build-bundle --runtime-repo="$FLATHUB_REPO" --gpg-sign="$GPG_KEY_ID" \
            repo "UnLauncher-${{ steps.version.outputs.version }}.flatpak" "$APP_ID" "$BRANCH"
          sha256sum "UnLauncher-${{ steps.version.outputs.version }}.flatpak" \
            > "UnLauncher-${{ steps.version.outputs.version }}.flatpak.sha256"
          du -sh repo; find repo -type f -size +90M

      - name: Hand over to the next jobs
        run: tar -cf site-repo.tar repo

      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          retention-days: 7
          if-no-files-found: error
          path: |
            site-repo.tar
            UnLauncher-*.flatpak
            UnLauncher-*.flatpak.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: flatpak
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" > /dev/null
          gh release upload "$TAG" --clobber UnLauncher-*.flatpak UnLauncher-*.flatpak.sha256

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      # Tags made before this packaging existed (v0.1.0) lack packaging/flatpak/;
      # the source is the tag's, the packaging comes from the workflow's ref.
      - uses: actions/checkout@v7
        with:
          path: workflow-ref
          sparse-checkout: packaging/flatpak
      - name: Packaging files missing from the tag
        run: |
          if [ ! -f packaging/flatpak/unlauncher-repo.gpg ]; then
            echo "Using packaging/flatpak from $GITHUB_SHA"
            rm -rf packaging/flatpak packaging/flathub
            cp -r workflow-ref/packaging/flatpak packaging/flatpak
          fi
          rm -rf workflow-ref
      - uses: actions/download-artifact@v8
        with:
          name: flatpak
      - name: Build the site
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir site && tar -xf site-repo.tar -C site
          GPGKEY=$(base64 -w0 packaging/flatpak/unlauncher-repo.gpg)
          cp packaging/linux/$APP_ID.png site/icon.png
          cat > site/$APP_ID.flatpakref <<REF
          [Flatpak Ref]
          Title=UnLauncher
          Name=$APP_ID
          Branch=$BRANCH
          Url=$SITE_URL/repo/
          SuggestRemoteName=unlauncher
          IsRuntime=false
          RuntimeRepo=$FLATHUB_REPO
          Homepage=https://github.com/krl0sconk/UnLauncher
          Icon=$SITE_URL/icon.png
          GPGKey=$GPGKEY
          REF
          cat > site/unlauncher.flatpakrepo <<REPO
          [Flatpak Repo]
          Title=UnLauncher
          Url=$SITE_URL/repo/
          Homepage=https://github.com/krl0sconk/UnLauncher
          Comment=Unreal Engine launcher for Linux
          Icon=$SITE_URL/icon.png
          DefaultBranch=$BRANCH
          GPGKey=$GPGKEY
          REPO
          sed "s/@VERSION@/$VERSION/g" packaging/flatpak/site/index.html > site/index.html
          du -sh site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
