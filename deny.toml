# cargo-deny configuration (CI job `cargo-deny`).
# UnLauncher is GPL-3.0-or-later: every dependency must be compatible with it.

[graph]
all-features = true

[advisories]
ignore = [
    # proc-macro-error is unmaintained. It comes in through gtk 0.18, which
    # wry and tao use for the web window; nothing in UnLauncher can replace it.
    "RUSTSEC-2024-0370",
    # glib 0.18 (same gtk 0.18 stack): the unsound `VariantStrIter` is not
    # used by UnLauncher.
    "RUSTSEC-2024-0429",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "LGPL-2.1-or-later",
    "GPL-2.0-or-later",
    "GPL-3.0-or-later",
]
exceptions = [
    # Apache-2.0 OR GPL-2.0-only: used under Apache-2.0.
    { allow = ["GPL-2.0-only"], crate = "self_cell" },
]

[bans]
multiple-versions = "allow"
# Workspace crates are path dependencies and never published.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
